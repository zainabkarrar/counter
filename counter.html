<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZKcounter</title>
    <link rel="stylesheet" href="/countertask/counter.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background">
        <div class="label">
            <h1>Counter</h1>
            <div class="mincount">
                <p>your mini counter</p>
                <img src="/countertask/2370617-celebrate-christmas-dandelion-flower-heart-light-star_85401.png" alt="heart" class="heart">
            </div>
        </div>
        <main class="counter">
            <div class="counter-box">
                <h2 class="no1">0</h2>
                <h2 class="no2">0</h2>
                <h2 class="no3">0</h2>
             <h2 class="no4">0</h2>
            </div>
            <strong>TIMES</strong> 
        </main>
        <div class="buttons">
            <button class="reset">RESET</button>
            <button class="decrease">DECREASE</button>
        </div>
    </div>
    <script src="/countertask/counter.js" defer></script>
</body>
</html>
